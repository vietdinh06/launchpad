
services:
  postgres:
    image: postgres:16
    container_name: launchpad-postgres
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad_dev
      POSTGRES_DB: launchpad
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad -d launchpad"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: launchpad-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  traefik:
    image: traefik:v3.3
    container_name: launchpad-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=launchpad-proxy"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - launchpad-proxy
    restart: unless-stopped

networks:
  launchpad-proxy:
    name: launchpad-proxy
    driver: bridge
    
volumes:
  postgres_data:
  redis_data:
